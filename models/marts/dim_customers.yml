version: 2

models:
  - name: dim_customers
    description: Customer dimension with one row per customer, including basic customer attributes and order lifecycle metrics such as first order date, most recent order date, order count, and lifetime value.
    columns:
      - name: customer_id
        description: Primary key for the customer dimension; one unique row per customer.
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: Customer's first name.

      - name: last_name
        description: Customer's last name.

      - name: first_order_date
        description: Date of the customer's first order.

      - name: most_recent_order_date
        description: Date of the customer's most recent order.

      - name: number_of_orders
        description: Total number of orders placed by the customer.

      - name: lifetime_value
        description: Total order amount accumulated across all customer orders.
