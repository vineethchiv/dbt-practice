version: 2

models:
  - name: stg_jaffle_shop__orders
    description: Staged order records from the jaffle_shop source with renamed keys.
    columns:
      - name: order_id
        description: Primary key for each order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the staged customer record.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current order lifecycle status.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
